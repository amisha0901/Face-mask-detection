<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Face Mask Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #fff;
            width: 100%;
            max-width: 520px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #1f4037;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #f5fffa;
        }

        .upload-area:hover {
            background: #eafff4;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            font-weight: 600;
            color: #1f4037;
        }

        .upload-hint {
            font-size: 13px;
            color: #888;
        }

        input[type="file"] {
            display: none;
        }

        .preview-container {
            display: none;
            margin-top: 25px;
            text-align: center;
        }

        .image-preview {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: #eee;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #eee;
            border-top: 4px solid #1f4037;
            border-radius: 50%;
            margin: 0 auto 10px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 25px;
        }

        .result-card {
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            background: #f6fff9;
        }

        .result-label {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-confidence {
            font-size: 18px;
            color: #1f4037;
        }

        .error {
            display: none;
            background: #ffe1e1;
            color: #c00;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .with-mask {
            color: green;
        }

        .no-mask {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>😷 Face Mask Detection</h1>
    <p class="subtitle">Upload a face image to detect mask usage</p>

    <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📸</div>
        <div class="upload-text">Click or Drag Image</div>
        <div class="upload-hint">PNG, JPG, JPEG</div>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="preview-container" id="previewContainer">
        <img id="imagePreview" class="image-preview">
        <button class="btn btn-primary" id="detectBtn">Detect Mask</button>
        <button class="btn btn-secondary" id="resetBtn">Upload Another</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        Detecting face mask...
    </div>

    <div class="results" id="results">
        <div class="result-card">
            <div class="result-label" id="resultLabel"></div>
            <div class="result-confidence" id="resultConfidence"></div>
        </div>
    </div>

    <div class="error" id="error"></div>

</div>

<script>
    const uploadArea = document.getElementById("uploadArea");
    const fileInput = document.getElementById("fileInput");
    const previewContainer = document.getElementById("previewContainer");
    const imagePreview = document.getElementById("imagePreview");
    const detectBtn = document.getElementById("detectBtn");
    const resetBtn = document.getElementById("resetBtn");
    const loading = document.getElementById("loading");
    const results = document.getElementById("results");
    const error = document.getElementById("error");
    const resultLabel = document.getElementById("resultLabel");
    const resultConfidence = document.getElementById("resultConfidence");

    let selectedFile = null;

    uploadArea.onclick = () => fileInput.click();

    fileInput.onchange = () => {
        selectedFile = fileInput.files[0];
        if (!selectedFile) return;

        const reader = new FileReader();
        reader.onload = () => {
            imagePreview.src = reader.result;
            uploadArea.style.display = "none";
            previewContainer.style.display = "block";
        };
        reader.readAsDataURL(selectedFile);
    };

    detectBtn.onclick = async () => {
        loading.style.display = "block";
        results.style.display = "none";
        error.style.display = "none";

        const formData = new FormData();
        formData.append("image", selectedFile);

        try {
            const response = await fetch("/classify", {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            const result = data.predictions[0];

            resultLabel.textContent = result.description;
            resultConfidence.textContent = `Confidence: ${result.confidence}%`;

            resultLabel.className =
                result.description.toLowerCase().includes("no")
                ? "result-label no-mask"
                : "result-label with-mask";

            results.style.display = "block";
        } catch {
            error.textContent = "Prediction failed. Try again.";
            error.style.display = "block";
        } finally {
            loading.style.display = "none";
        }
    };

    resetBtn.onclick = () => {
        fileInput.value = "";
        selectedFile = null;
        uploadArea.style.display = "block";
        previewContainer.style.display = "none";
        results.style.display = "none";
        error.style.display = "none";
    };
</script>

</body>
</html>
