<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mask Detection</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      align-items: center;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 1rem;
      color: #333;
    }

    #video {
      width: 320px;
      height: 240px;
      background: #000;
      border-radius: 8px;
      border: 2px solid #555;
      object-fit: cover;
    }

    .controls {
      margin-top: 1rem;
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #0078ff;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #result {
      margin-top: 1.5rem;
      font-size: 18px;
      color: #222;
      padding: 8px 12px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>
  <h1>Face Mask Detection</h1>

  <video id="video" autoplay muted></video>

  <div class="controls">
    <button id="startBtn">Start Camera</button>
    <button id="detectBtn" disabled>Detect Mask</button>
  </div>

  <div id="result">Result: —</div>

  <script>
    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const detectBtn = document.getElementById("detectBtn");
    const resultEl = document.getElementById("result");

    // Start camera
    startBtn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        detectBtn.disabled = false;
        resultEl.textContent = "Result: Camera started";
      } catch (err) {
        console.error(err);
        resultEl.textContent = "Result: Unable to access camera";
      }
    });

    // Dummy detection event (replace with real inferencing)
    detectBtn.addEventListener("click", () => {
      resultEl.textContent = "Result: Detecting…";

      // Example: simulate detection
      setTimeout(() => {
        const wearingMask = Math.random() < 0.5;
        resultEl.textContent = wearingMask
          ? "Result: Mask Detected"
          : "Result: No Mask Detected";
      }, 1000);
    });
  </script>
</body>
</html>
